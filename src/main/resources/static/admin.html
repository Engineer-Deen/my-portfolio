<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Portfolio</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1>Admin Login</h1>
        <input type="password" id="passwordInput" placeholder="Enter admin password" autocomplete="off">
        <button id="loginBtn">Log In</button>
        <p id="loginError" class="error-text"></p>
    </div>
</div>

<div id="dashboard" class="dashboard hidden">
    <header class="admin-header">
        <h1>Portfolio Admin</h1>
        <button id="logoutBtn" class="btn-secondary">Log Out</button>
    </header>

    <section class="panel">
        <h2>Profile Photo</h2>
        <div class="photo-upload-row">
            <input type="file" id="photoInput" accept="image/*">
            <button id="uploadPhotoBtn">Upload Photo</button>
        </div>
        <p id="photoStatus" class="status-text"></p>
    </section>

    <section class="panel">
        <h2>Projects</h2>

        <div id="projectsList" class="items-list"></div>

        <h3>Add New Project</h3>
        <form id="projectForm" class="admin-form">
            <input type="hidden" id="projectId">
            <input type="text" id="projTitle" placeholder="Title" required>
            <select id="projCategory" required>
                <option value="cyber">Cybersecurity</option>
                <option value="backend">Backend</option>
                <option value="db">Database</option>
            </select>
            <textarea id="projDescription" placeholder="Description" required></textarea>
            <input type="text" id="projPurpose" placeholder="Purpose">
            <input type="text" id="projTechnologies" placeholder="Technologies (comma-separated)">
            <input type="text" id="projGithubUrl" placeholder="GitHub URL">
            <input type="text" id="projLiveUrl" placeholder="Live URL">
            <input type="number" id="projOrder" placeholder="Order" value="1">
            <button type="submit" id="projSubmitBtn">Add Project</button>
            <button type="button" id="projCancelBtn" class="btn-secondary hidden">Cancel Edit</button>
        </form>
        <p id="projectStatus" class="status-text"></p>
    </section>

    <section class="panel">
        <h2>Skills</h2>

        <div id="skillGroupsList" class="items-list"></div>

        <h3>Add New Skill Group</h3>
        <form id="skillGroupForm" class="admin-form">
            <input type="hidden" id="skillGroupId">
            <input type="text" id="skillGroupName" placeholder="Group Name (e.g. Programming Languages)" required>
            <input type="number" id="skillGroupOrder" placeholder="Order" value="1">
            <textarea id="skillGroupSkills" placeholder="One skill per line. Add |accent to highlight it, e.g.&#10;Python|accent&#10;Java&#10;Bash / Shell" required></textarea>
            <button type="submit" id="skillGroupSubmitBtn">Add Skill Group</button>
            <button type="button" id="skillGroupCancelBtn" class="btn-secondary hidden">Cancel Edit</button>
        </form>
        <p id="skillGroupStatus" class="status-text"></p>
    </section>

    <section class="panel">
        <h2>Research Topics</h2>

        <div id="researchList" class="items-list"></div>

        <h3>Add New Research Topic</h3>
        <form id="researchForm" class="admin-form">
            <input type="hidden" id="researchId">
            <input type="text" id="researchTitle" placeholder="Title" required>
            <textarea id="researchDescription" placeholder="Description" required></textarea>
            <input type="number" id="researchProgress" placeholder="Progress (0-100)" min="0" max="100" value="0" required>
            <input type="text" id="researchStatusLabel" placeholder="Status Label (e.g. In Progress)" required>
            <input type="number" id="researchOrder" placeholder="Order" value="1">
            <button type="submit" id="researchSubmitBtn">Add Research Topic</button>
            <button type="button" id="researchCancelBtn" class="btn-secondary hidden">Cancel Edit</button>
        </form>
        <p id="researchStatus" class="status-text"></p>
    </section>
</div>

<section class="panel">
    <h2>Job Postings</h2>

    <div id="postingsList" class="items-list"></div>

    <h3>Add New Job Posting</h3>
    <form id="postingForm" class="admin-form">
        <input type="hidden" id="postingId">
        <input type="text" id="postingTitle" placeholder="Position Title (e.g. DeenPOS Sales Agent)" required>
        <textarea id="postingPurpose" placeholder="Purpose / description of what they're applying for" required></textarea>
        <input type="number" id="postingOrder" placeholder="Order" value="1">
        <textarea id="postingFields" placeholder="One custom field per line, format: Label|type|required&#10;Years of Experience|text|true&#10;Why do you want this role?|textarea|true&#10;Phone Number|tel|false&#10;&#10;Valid types: text, email, tel, number, textarea"></textarea>
        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:#9fb0cc;">
            <input type="checkbox" id="postingActive" checked style="width:auto;"> Active (visible on site)
        </label>
        <button type="submit" id="postingSubmitBtn">Add Posting</button>
        <button type="button" id="postingCancelBtn" class="btn-secondary hidden">Cancel Edit</button>
    </form>
    <p id="postingStatus" class="status-text"></p>
</section>

<script src="js/admin.js"></script>
</body>
</html>
